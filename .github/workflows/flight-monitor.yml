name: Flight Price Monitor

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
jobs:
  update-price:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions.noreply.github.com"

      - name: Update flight price
        run: pnpm run once

      - name: Save updated data
        run: |
          git add flight-prices.sqlite
          git add index.html dashboard.html
          git commit -m "Update flight price data and dashboard" || echo "No changes to commit"
          git push  